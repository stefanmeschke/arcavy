min_version = "2026.10.8"

[settings]
experimental = true

[tools]
go = "1.27"
node = "22"
pnpm = "12.14.0"
"npm:oxlint" = "1.88.0"
oxfmt = "0.73.0"
hk = "2.6.0"
markdownlint-cli2 = "0.23.2"
typos = "1.51.1"

[tasks."lint:md"]
description = "Lint Markdown"
run = "markdownlint-cli2 '**/*.md' '#**/node_modules'"

[tasks."lint:spelling"]
description = "Spell-check docs and code"
run = "typos"

[tasks."lint:js"]
description = "Lint JS/TS with Oxlint"
run = "oxlint"

[tasks."lint:fmt"]
description = "Check formatting with Oxfmt"
run = "oxfmt --check"

[tasks.fmt]
description = "Format JS/TS/JSON/HTML/CSS with Oxfmt"
run = "oxfmt"

[deps.book-pile-loader]
description = "Install book-pile-loader dependencies"
run = "pnpm install --frozen-lockfile"
dir = "experiments/book-pile-loader"
auto = true
sources = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml"]
outputs = ["node_modules"]

[tasks."dev:book-pile-loader"]
description = "Serve book-pile-loader experiment"
dir = "experiments/book-pile-loader"
run = "pnpm dev"

[tasks."typecheck:book-pile-loader"]
description = "Typecheck book-pile-loader experiment"
dir = "experiments/book-pile-loader"
run = "pnpm typecheck"

[tasks."build:book-pile-loader"]
description = "Build book-pile-loader experiment"
dir = "experiments/book-pile-loader"
run = "pnpm build"

[tasks.lint]
description = "Run all linters"
depends = ["lint:*"]

[tasks."install:browsers:book-pile-loader"]
description = "Install the Chromium browser for Playwright (no-op when present)"
dir = "experiments/book-pile-loader"
run = "if [ -n \"$CI\" ]; then pnpm exec playwright install --with-deps chromium; else pnpm exec playwright install chromium; fi"

[tasks."test:book-pile-loader"]
description = "Playwright rendering smoke test for book-pile-loader"
depends = ["install:browsers:book-pile-loader"]
dir = "experiments/book-pile-loader"
run = "pnpm exec playwright test"

[tasks.test]
description = "Run all tests"
depends = ["test:*"]

[tasks.ci]
description = "Everything CI runs"
# Sequential, like the CI workflow steps.
run = [
  { task = "lint" },
  { task = "typecheck:*" },
  { task = "build:*" },
  { task = "test" },
]
