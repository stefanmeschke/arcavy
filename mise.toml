[tools]
go = "1.27"
node = "22"
pnpm = "12.14.0"
"npm:oxlint" = "1.88.0"
oxfmt = "0.73.0"
hk = "2.6.0"
markdownlint-cli2 = "0.23.2"
typos = "1.51.1"

[tasks."lint:md"]
description = "Lint Markdown"
run = "markdownlint-cli2 '**/*.md' '#**/node_modules'"

[tasks."lint:spelling"]
description = "Spell-check docs and code"
run = "typos"

[tasks."lint:js"]
description = "Lint JS/TS with Oxlint"
run = "oxlint"

[tasks."lint:fmt"]
description = "Check formatting with Oxfmt"
run = "oxfmt --check"

[tasks.fmt]
description = "Format JS/TS/JSON/HTML/CSS with Oxfmt"
run = "oxfmt"

[tasks."dev:book-pile-loader"]
description = "Serve book-pile-loader experiment"
dir = "experiments/book-pile-loader"
run = "pnpm install --frozen-lockfile && pnpm dev"

[tasks."typecheck:book-pile-loader"]
description = "Typecheck book-pile-loader experiment"
dir = "experiments/book-pile-loader"
run = "pnpm install --frozen-lockfile && pnpm typecheck"

[tasks."build:book-pile-loader"]
description = "Build book-pile-loader experiment"
dir = "experiments/book-pile-loader"
run = "pnpm install --frozen-lockfile && pnpm build"

[tasks.lint]
description = "Run all linters"
depends = ["lint:*"]

[tasks.test]
description = "Run all tests"
run = "echo 'no tests yet'"

[tasks.ci]
description = "Everything CI runs"
# Sequential, like the CI workflow steps.
run = [
  { task = "lint" },
  { task = "typecheck:*" },
  { task = "build:*" },
  { task = "test" },
]
