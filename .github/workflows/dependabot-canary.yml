name: Dependabot canary

# Intentionally pinned to an outdated action so Dependabot has something to bump.
# Used to verify the Dependabot + auto-merge setup end to end.
on: workflow_dispatch

permissions: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo canary
