name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Lint
        run: mise run lint
      - name: Typecheck
        run: mise run '//...:typecheck'
      - name: Build
        run: mise run '//...:build'
      - name: Test
        run: mise run '//...:test'
