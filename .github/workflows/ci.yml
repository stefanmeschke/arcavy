name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      - name: Lint
        run: mise run lint
      - name: Typecheck
        run: mise run '//...:typecheck'
      - name: Build
        run: mise run '//...:build'
      - name: Test
        run: mise run '//...:test'
